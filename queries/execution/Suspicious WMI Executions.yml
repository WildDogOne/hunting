title: Suspicious WMI Executions
id: 21912764-70fb-4cb5-ab43-303c703045c6
status: test
description: |
  This query detects processes with WMI as parent.
  It compared the last 30days against the last 24h to detect anomalies.
  CCM has been removed from the query as it is a common false positive.
author:
  - FalconForce
date: 2024/07/17
modified: 2024/07/17
tags:
  - attack.execution
  - attack.t1047
logsource:
  product: microsoft defender for endpoint
detection:
  load: medium
  kusto: |
    from logs-o365.audit-default
    //| WHERE @timestamp > now() - 30 day
    | WHERE user.domain == "{{domain}}" OR user.domain LIKE "%.onmicrosoft.com"
    //| WHERE `source.geo.country_name`!="Switzerland"
    | WHERE MV_CONTAINS(event.category, "authentication")
    | WHERE o365.audit.DeviceProperties.OS IS NOT NULL
    | EVAL user_agent.os.full = TO_LOWER(REPLACE(user_agent.os.full, " ", ""))
    | EVAL o365.audit.DeviceProperties.OS = TO_LOWER(REPLACE(o365.audit.DeviceProperties.OS, " ", ""))
    | GROK user_agent.os.full "%{DATA:user_agent.os.full}\\d"
    | GROK o365.audit.DeviceProperties.OS "%{DATA:o365.audit.DeviceProperties.OS}\\d"
    | WHERE user_agent.os.full != o365.audit.DeviceProperties.OS
    | KEEP user.name, source.geo.country_name, user_agent.os.full, o365.audit.DeviceProperties.OS, source.geo.country_name
falsepositives:
  - N/A
level: medium
