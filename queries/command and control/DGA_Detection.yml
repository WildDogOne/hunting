    | WHERE ml_is_dga.malicious_prediction > 0 AND ml_is_dga.malicious_probability > 0.99
    | WHERE `dns.question.name` != "_https._tcp.nvidia.github.io" // Some generic exclusions of DNS we found legitimate
        AND `dns.question.name` != "xbrlus.github.io"
        AND `dns.question.name` != "iqtree.github.io"
        AND `client.network.zone` != "edu" // Exclude Network Zones that you don't want to monitor
        AND `client.address` != "{{border_firewall}}" // You may want to exclude things like border firewalls and exchange servers that often use DNS lookups for checking validity of a request and not because of an attack.
    | STATS distinct_domains = COUNT_DISTINCT(dns.question.name), domains = VALUES(dns.question.name) BY client.address, client.network.zone, bucket(@timestamp, 24 hour)
    | SORT distinct_domains DESC
