logsource:
  product: microsoft defender for endpoint
detection:
  esql: |
    from logs-infoblox_nios.log-*
    | WHERE NOT ENDS_WITH(dns.question.name, ".{{domain}}")
    | WHERE MV_CONTAINS(related.hosts, "dns1.{{domain}}")
    | WHERE dns.question.top_level_domain IS NOT NULL
